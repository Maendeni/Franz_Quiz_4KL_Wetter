<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#150f0c">
<!-- Über „Zum Home-Bildschirm" startet das Quiz im Vollbild und behält seinen Speicher -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Üben">
<!-- Symbol für den Home-Bildschirm; iOS rundet die Ecken selbst -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Sprachen Üben ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Zauberschule: Pergament, Tinte, Gold, Kerzenschein */
    --pergament:      #f2e3c2;
    --pergament-hell: #faf1da;
    --pergament-dunkel: #e2cfa4;
    --tinte:       #2a1c10;
    --tinte-blass: #6b563c;
    --gold:        #c9a227;
    --gold-hell:   #e9cf7a;
    --dunkel:      #150f0c;
    --dunkel-warm: #241a13;
    --correct: #2f7d4f;
    --wrong:   #a32b2b;
    --bg: var(--dunkel);
    --text: var(--tinte);
    --muted: var(--tinte-blass);
    --radius: 10px;
    --c: #7b1f2b;
    --cl: #f0d9d2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: var(--dunkel);
    color: var(--pergament);
    min-height: 100vh;
    min-height: 100dvh;
    /* Kerzenschein aus zwei Ecken, dazu ein warmer Schimmer in der Mitte */
    background-image: radial-gradient(circle at 15% 8%,  rgba(201,162,39,0.22) 0%, transparent 42%),
                      radial-gradient(circle at 88% 92%, rgba(180,90,40,0.18) 0%, transparent 45%),
                      radial-gradient(circle at 50% 45%, rgba(90,60,30,0.35) 0%, transparent 65%);
    background-attachment: fixed;
    /* iOS: nichts unter der Home-Leiste verstecken */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             calc(env(safe-area-inset-bottom) + 30px) env(safe-area-inset-left);
  }

  /* Keine Tipp-Verzögerung, kein Doppeltipp-Zoom, kein graues Blitzen,
     kein Text-Markieren beim Langdruck (iOS) */
  button {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: inherit;
    cursor: pointer;
    color: var(--text);
  }

  .wrap { max-width: 480px; margin: 0 auto; padding: 0 14px; }

  /* ── KOPFZEILE ───────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0 10px;
  }

  .back-btn {
    width: 40px; height: 40px;
    flex-shrink: 0;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    background: var(--dunkel-warm);
    color: var(--gold-hell);
    box-shadow: 0 0 12px rgba(201,162,39,0.25);
    font-size: 1.25rem;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .back-btn:active { transform: scale(0.92); }
  body.quiz .back-btn { display: flex; }

  header h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #e9cf7a, #c9a227 55%, #8c6b14);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 18px rgba(201,162,39,0.25);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── STARTMENÜ ───────────────────────────── */
  body.quiz #menu { display: none; }
  body:not(.quiz) #quiz { display: none; }

  #quiz { animation: reinRechts 0.25s ease; }
  @keyframes reinRechts {
    from { opacity: 0; transform: translateX(14px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .resume {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    border: 1.5px solid var(--gold);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 22px;
    color: var(--gold-hell);
    background: linear-gradient(135deg, #3a2418, #241a13 60%, #1c1410);
    box-shadow: 0 0 22px rgba(201,162,39,0.18), inset 0 0 30px rgba(201,162,39,0.07);
  }
  .resume:active { transform: scale(0.985); }
  .resume .emoji { font-size: 1.6rem; }
  .resume .t { flex: 1; min-width: 0; }
  .resume .t b {
    display: block;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--gold-hell);
  }
  .resume .t span { font-size: 0.82rem; font-weight: 600; color: #b9a37a; }
  .resume .go { font-size: 1.2rem; color: var(--gold); }

  .group { margin-bottom: 14px; }

  .group-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 44px;
    background: none;
    border: none;
    padding: 8px 4px;
    text-align: left;
  }
  .group-head .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .group-head .title {
    flex: 1;
    min-width: 0;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .group-head .niveau {
    font-size: 0.72rem;
    font-weight: 700;
    color: #9c7f4e;
    white-space: nowrap;
  }
  .group-head .chev { font-size: 0.7rem; color: #9c7f4e; transition: transform 0.2s ease; }
  .group.closed .chev { transform: rotate(-90deg); }
  .group.closed .deck-list { display: none; }

  .deck-list { display: flex; flex-direction: column; gap: 8px; }

  /* Deck-Karte = Pergamentstreifen mit Wachssiegel */
  .deck {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 64px;
    text-align: left;
    color: var(--tinte);
    background:
      linear-gradient(115deg, rgba(255,255,255,0.35) 0%, transparent 35%),
      radial-gradient(ellipse at 80% 120%, rgba(120,80,30,0.14) 0%, transparent 60%),
      var(--pergament);
    border: 1px solid var(--pergament-dunkel);
    border-left: 5px solid var(--dc, #7b1f2b);
    border-radius: 4px;
    padding: 12px 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45);
  }
  .deck:active { transform: scale(0.985); box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  @media (hover: hover) {
    .deck:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.55), 0 0 0 1px var(--gold); }
  }
  .deck.leer { opacity: 0.42; }
  .deck.leer:active { transform: none; }

  .deck .icon {
    width: 38px; height: 38px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--dc, #7b1f2b);
    border: 2px solid var(--gold);
    box-shadow: inset 0 1px 3px rgba(255,255,255,0.25), 0 1px 3px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
  }
  .deck .txt { flex: 1; min-width: 0; }
  .deck .txt b {
    display: block;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.3;
    color: var(--tinte);
  }
  .deck .txt span { font-size: 0.8rem; font-weight: 500; font-style: italic; color: var(--tinte-blass); }
  .deck .ring {
    flex-shrink: 0;
    width: 34px; height: 34px;
    display: grid;
    place-items: center;
    font-size: 0.62rem;
    font-weight: 700;
    color: #7a5c1e;
    border-radius: 50%;
    background: conic-gradient(var(--gold) calc(var(--p, 0) * 1%), rgba(120,90,40,0.18) 0);
    position: relative;
  }
  .deck .ring::before {
    content: '';
    position: absolute;
    inset: 4px;
    background: var(--pergament);
    border-radius: 50%;
  }
  .deck .ring i { position: relative; font-style: normal; }

  .hinweis {
    margin-top: 22px;
    text-align: center;
    font-size: 0.76rem;
    font-style: italic;
    color: #7a6748;
  }

  /* ── SPIELER-LEISTE ──────────────────────── */
  .player-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .level-badge {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--gold-hell);
    white-space: nowrap;
  }
  .xp-bar-wrap {
    flex: 1;
    background: rgba(120,90,40,0.25);
    border: 1px solid rgba(201,162,39,0.35);
    border-radius: 50px;
    height: 8px;
    overflow: hidden;
    min-width: 50px;
  }
  .xp-bar-fill {
    height: 100%;
    border-radius: 50px;
    background: linear-gradient(90deg, #8c6b14, #e9cf7a);
    box-shadow: 0 0 8px rgba(233,207,122,0.6);
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .xp-label { font-size: 0.72rem; font-weight: 600; color: #9c7f4e; white-space: nowrap; }

  /* ── MODUS-LEISTE ────────────────────────── */
  .mode-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .modes {
    display: flex;
    border-radius: 50px;
    border: 1.5px solid rgba(201,162,39,0.45);
    background: rgba(36,26,19,0.8);
    overflow: hidden;
  }
  .mode-btn {
    min-height: 38px;
    padding: 6px 12px;
    border: none;
    background: transparent;
    font-size: 0.8rem;
    font-weight: 600;
    color: #b9a37a;
    white-space: nowrap;
  }
  .mode-btn.active {
    background: linear-gradient(180deg, #e9cf7a, #c9a227);
    color: #2a1c10;
    font-weight: 700;
    border-radius: 50px;
  }

  .toggle-wrap { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: rgba(120,90,40,0.45);
    border: 1px solid rgba(201,162,39,0.35);
    border-radius: 50px;
    transition: background 0.25s;
    cursor: pointer;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; top: 3px;
    background: var(--pergament-hell);
    border-radius: 50%;
    transition: transform 0.25s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .toggle-wrap input:checked + .toggle-slider { background: linear-gradient(180deg, #e9cf7a, #c9a227); }
  .toggle-wrap input:checked + .toggle-slider::before { transform: translateX(20px); }
  .autoread-icon { font-size: 0.95rem; }

  /* ── FORTSCHRITT ─────────────────────────── */
  .progress-bar-wrap {
    background: rgba(120,90,40,0.25);
    border: 1px solid rgba(201,162,39,0.3);
    border-radius: 50px;
    height: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 50px;
    transition: width 0.4s ease;
    background: linear-gradient(90deg, #8c6b14, #e9cf7a);
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.84rem;
    color: #9c7f4e;
    font-weight: 600;
    margin-bottom: 18px;
  }

  /* ── KARTE ───────────────────────────────── */
  /* Quiz-Karte = aufgeschlagenes Pergament */
  .card {
    color: var(--tinte);
    background:
      linear-gradient(125deg, rgba(255,255,255,0.4) 0%, transparent 30%),
      radial-gradient(ellipse at 15% 100%, rgba(120,80,30,0.13) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 0%, rgba(120,80,30,0.1) 0%, transparent 50%),
      var(--pergament);
    border: 1px solid var(--pergament-dunkel);
    border-top: 4px solid var(--c);
    border-radius: var(--radius);
    padding: 30px 22px 26px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.55), inset 0 0 40px rgba(180,140,80,0.15);
    animation: slideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-label {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #8a6d3f;
    margin-bottom: 10px;
  }

  .card-word-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .card-word {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.85rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--tinte);
  }

  .speak-btn {
    background: rgba(255,255,255,0.35);
    border: 1.5px solid var(--pergament-dunkel);
    border-radius: 50%;
    width: 40px; height: 40px;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    color: var(--tinte-blass);
  }
  .speak-btn:active { border-color: var(--c); background: var(--cl); color: var(--c); }
  .speak-btn.speaking {
    border-color: var(--c);
    background: var(--cl);
    color: var(--c);
    animation: speakPulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes speakPulse {
    from { transform: scale(1); }
    to   { transform: scale(1.15); }
  }

  /* ── ANTWORTEN ───────────────────────────── */
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .ans-btn {
    min-height: 54px;
    padding: 13px 10px;
    border-radius: 6px;
    border: 1.5px solid var(--pergament-dunkel);
    background: linear-gradient(180deg, var(--pergament-hell), #f0e0be);
    color: var(--tinte);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1.05rem;
    font-weight: 600;
    transition: all 0.15s ease;
    line-height: 1.3;
    box-shadow: 0 1px 2px rgba(90,60,20,0.18);
  }
  .ans-btn:active:not(:disabled) { border-color: var(--gold); background: var(--cl); }
  @media (hover: hover) {
    .ans-btn:hover:not(:disabled) { border-color: var(--gold); background: var(--cl); }
  }
  .ans-btn.correct {
    background: #d8e8cf;
    border-color: var(--correct);
    color: #1e5233;
    box-shadow: 0 0 12px rgba(47,125,79,0.35);
  }
  .ans-btn.wrong {
    background: #eed6d1;
    border-color: var(--wrong);
    color: #7d1f1f;
  }
  .ans-btn:disabled { cursor: default; }

  /* ── RÜCKMELDUNG ─────────────────────────── */
  .feedback {
    margin-top: 18px;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.15rem;
    font-weight: 700;
    min-height: 34px;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  .feedback.correct { color: #2f7d4f; }
  .feedback.wrong   { color: #a32b2b; }

  .next-btn-wrap { display: flex; justify-content: center; margin: 14px auto 0; }
  .next-btn {
    position: relative;
    min-height: 46px;
    padding: 11px 28px;
    border-radius: 50px;
    border: 1.5px solid var(--gold);
    background: linear-gradient(180deg, #3a2418, #241a13);
    color: var(--gold-hell);
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.9rem;
    font-weight: 700;
    box-shadow: 0 3px 12px rgba(0,0,0,0.4), 0 0 14px rgba(201,162,39,0.2);
    overflow: hidden;
  }
  .next-btn:active { transform: translateY(1px); }
  .next-btn.hidden { display: none; }
  .next-btn .countdown-fill {
    position: absolute;
    top: 0; right: 0;
    height: 100%; width: 100%;
    background: rgba(201,162,39,0.3);
    transform-origin: right center;
    border-radius: 50px;
  }
  .next-btn.counting .countdown-fill {
    animation: drainLeft var(--countdown-dur, 2s) linear forwards;
  }
  @keyframes drainLeft {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }
  .next-btn span { position: relative; z-index: 1; }

  /* ── ERGEBNIS ────────────────────────────── */
  .result-screen { text-align: center; padding: 30px 10px; position: relative; animation: slideIn 0.4s ease; }
  .result-screen h2 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--gold-hell);
    margin-bottom: 10px;
    animation: fadeSlideUp 0.5s ease 0.2s both;
  }
  .result-score {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 2.6rem;
    font-weight: 900;
    color: var(--gold);
    margin: 8px 0 18px;
    text-shadow: 0 0 20px rgba(201,162,39,0.35);
    animation: fadeSlideUp 0.5s ease 0.35s both;
  }
  .result-screen p { color: #b9a37a; font-size: 1rem; font-style: italic; margin-bottom: 22px; }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .stars {
    font-size: 1.5rem;
    margin-bottom: 6px;
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(201,162,39,0.6);
  }

  .result-btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .restart-btn {
    min-height: 52px;
    padding: 14px 38px;
    border-radius: 50px;
    border: 1.5px solid var(--gold);
    background: linear-gradient(180deg, #e9cf7a, #c9a227);
    color: #2a1c10;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.98rem;
    font-weight: 700;
    box-shadow: 0 4px 22px rgba(201,162,39,0.35);
  }
  .restart-btn:active { transform: translateY(1px); }
  .menu-btn {
    min-height: 44px;
    padding: 10px 26px;
    border-radius: 50px;
    border: 1.5px solid rgba(201,162,39,0.4);
    background: transparent;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: #b9a37a;
  }

  /* ── ANIMATIONEN ERGEBNIS ────────────────── */
  #anim-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
  }

  /* Zauberstab mit leuchtender Spitze (ab 70%) */
  .stab-wrap { position: relative; width: 150px; height: 120px; margin: 0 auto 14px; }
  .stab {
    position: absolute;
    left: 14px; bottom: 26px;
    width: 100px; height: 9px;
    border-radius: 5px;
    background: linear-gradient(90deg, #2f1d12, #6b4a2a 55%, #8a6a3a);
    transform: rotate(-30deg);
    transform-origin: left bottom;
    box-shadow: 0 3px 8px rgba(0,0,0,0.55);
  }
  .stab-licht {
    position: absolute;
    left: 88px; top: 14px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle, #fffbe8 0%, #e9cf7a 40%, rgba(233,207,122,0.35) 62%, transparent 72%);
    animation: stabPuls 1.7s ease-in-out infinite;
  }
  @keyframes stabPuls {
    0%, 100% { transform: scale(1);    opacity: 0.85; }
    50%      { transform: scale(1.35); opacity: 1; }
  }
  .funke {
    position: absolute;
    left: 102px; top: 28px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #f3dc9b;
    box-shadow: 0 0 8px #e9cf7a;
    animation: funkeFliegt 1.9s ease-out infinite;
  }
  @keyframes funkeFliegt {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }

  /* Brennende Kerze (ab 40%) */
  .kerze-wrap { width: 120px; height: 118px; margin: 0 auto 14px; position: relative; }
  .kerze-koerper {
    position: absolute;
    left: 50%; bottom: 6px;
    transform: translateX(-50%);
    width: 26px; height: 58px;
    border-radius: 4px 4px 3px 3px;
    background: linear-gradient(90deg, #d9c69c, #f7eed6 42%, #dccaa2);
    box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  }
  .kerze-docht {
    position: absolute;
    left: 50%; bottom: 64px;
    transform: translateX(-50%);
    width: 2px; height: 9px;
    background: #2f1d12;
  }
  .kerze-flamme {
    position: absolute;
    left: 50%; bottom: 71px;
    width: 17px; height: 28px;
    border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
    background: radial-gradient(circle at 50% 72%, #fffbe8 0%, #ffe9a8 22%, #f5b53c 48%, rgba(240,120,20,0.55) 76%, transparent 88%);
    box-shadow: 0 0 30px rgba(245,181,60,0.55);
    animation: flackern 1.15s ease-in-out infinite;
  }
  @keyframes flackern {
    0%, 100% { transform: translateX(-50%) scale(1) rotate(-1.5deg); }
    50%      { transform: translateX(-50%) scale(1.07, 1.13) rotate(1.5deg); }
  }

  /* Nebelschwaden (unter 40%) */
  .nebel-wrap { position: relative; height: 96px; margin-bottom: 10px; overflow: hidden; }
  .nebel {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(198,206,214,0.45), rgba(160,170,180,0.15) 55%, transparent 72%);
    filter: blur(7px);
    animation: ziehen linear infinite;
  }
  @keyframes ziehen {
    0%   { transform: translateX(-130px); opacity: 0; }
    25%  { opacity: 0.9; }
    75%  { opacity: 0.9; }
    100% { transform: translateX(130px); opacity: 0; }
  }
  .kessel { display: block; margin: 0 auto; animation: kesselWackelt 3s ease-in-out infinite; }
  @keyframes kesselWackelt {
    0%, 100% { transform: rotate(-1.5deg); }
    50%      { transform: rotate(1.5deg); }
  }

  /* ── XP-POPUP & LEVEL-UP ─────────────────── */
  .xp-popup {
    position: fixed;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--gold-hell);
    text-shadow: 0 0 10px rgba(201,162,39,0.7);
    pointer-events: none;
    z-index: 1001;
    transform: translateX(-50%);
    animation: xpFloat 1.1s ease forwards;
  }
  @keyframes xpFloat {
    0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-55px); }
  }

  .level-up-toast {
    position: fixed;
    top: 50%; left: 50%;
    background: linear-gradient(160deg, #3a2418, #241a13);
    border: 2px solid var(--gold);
    color: var(--gold-hell);
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.15rem;
    font-weight: 700;
    padding: 20px 34px;
    border-radius: 12px;
    text-align: center;
    line-height: 1.6;
    box-shadow: 0 8px 50px rgba(201,162,39,0.4), inset 0 0 40px rgba(201,162,39,0.1);
    z-index: 1002;
    pointer-events: none;
    animation: levelUpPop 2.6s ease forwards;
  }
  @keyframes levelUpPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    12%  { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    20%  { transform: translate(-50%, -50%) scale(1); }
    75%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
  }
</style>
</head>
<body>

<canvas id="anim-canvas"></canvas>

<div class="wrap">
  <header>
    <button class="back-btn" onclick="zumMenu()" aria-label="Zurück zum Menü">←</button>
    <h1 id="kopf">✦ Sprachen Üben ✦</h1>
  </header>

  <!-- ══ STARTMENÜ ══ -->
  <div id="menu">
    <button class="resume" id="resume-btn" style="display:none"></button>
    <div id="gruppen"></div>
    <div class="hinweis" id="hinweis"></div>
  </div>

  <!-- ══ QUIZ ══ -->
  <div id="quiz">
    <div class="player-bar">
      <span class="level-badge" id="level-badge">⭐ Niv. 1</span>
      <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xp-bar-fill" style="width:0%"></div></div>
      <span class="xp-label" id="xp-label">0 / 50 XP</span>
    </div>

    <div class="mode-bar">
      <div class="modes" id="modi"></div>
      <label class="toggle-wrap" title="Automatisch vorlesen">
        <input type="checkbox" id="autoread-toggle" onchange="setzeVorlesen(this.checked)">
        <span class="toggle-slider"></span>
      </label>
      <span class="autoread-icon">🔊</span>
    </div>

    <div id="quiz-area"></div>
  </div>
</div>

<script src="vokabeln.js"></script>
<script>
// ════════════════════════════════════════════════════════════
//  SPEICHER
//  Alles unter einem Schlüssel. localStorage kann gesperrt sein
//  (Privatmodus, file://) → darf nie zum Absturz führen.
// ════════════════════════════════════════════════════════════
const SPEICHER = 'franz_quiz_v1';
const MAX_FEHLER = 80;

function leereDaten() {
  return { version: 1, xp: { fr: 0, en: 0 }, decks: {}, fehler: [], letztes: null, vorlesen: true };
}

function ladeDaten() {
  let d = leereDaten();
  try {
    const roh = localStorage.getItem(SPEICHER);
    if (roh) {
      const gespeichert = JSON.parse(roh);
      d = Object.assign(d, gespeichert);
      d.xp = Object.assign({ fr: 0, en: 0 }, gespeichert.xp);
    } else {
      // Umzug vom alten Format: die bisherigen XP zählten alle für Französisch
      const alt = parseInt(localStorage.getItem('quiz_xp') || '0');
      if (alt > 0) d.xp.fr = alt;
    }
  } catch (e) {}
  return d;
}

function speichere() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(daten)); } catch (e) {}
}

const daten = ladeDaten();

// ════════════════════════════════════════════════════════════
//  DECKS AUFBEREITEN
// ════════════════════════════════════════════════════════════
const alleDecks = {};
QUIZ_DATEN.gruppen.forEach(g => {
  g.decks.forEach(d => {
    d.gruppe = g;
    d.sprache = g.sprache;
    d.farbe = g.farbe;
    d.hell = g.hell;
    alleDecks[d.id] = d;
  });
});

function standardModus(deck) {
  return { vokabeln: 'f-d', artikel: 'artikel', konjugation: 'konj', zahlen: 'num-f', fehler: 'gemischt' }[deck.typ];
}

function modiVon(deck) {
  const f = deck.sprache === 'en' ? '🇬🇧' : '🇫🇷';
  switch (deck.typ) {
    case 'vokabeln':    return [{ id: 'f-d', label: `${f}→🇩🇪` }, { id: 'd-f', label: `🇩🇪→${f}` }];
    case 'artikel':     return [{ id: 'artikel', label: 'un / une / des' }];
    case 'konjugation': return [{ id: 'konj', label: 'Formen' }];
    case 'zahlen':      return [{ id: 'num-f', label: '🔢→🇫🇷' }, { id: 'f-num', label: '🇫🇷→🔢' }];
    default:            return [{ id: 'gemischt', label: 'Gemischt' }];
  }
}

function anzahlWoerter(deck) {
  return deck.typ === 'fehler' ? daten.fehler.length : deck.woerter.length;
}

// Stabiler Schlüssel eines Eintrags – für die Fehlerliste
function schluessel(eintrag) {
  return eintrag.num !== undefined ? String(eintrag.num) : eintrag.fr;
}

// ════════════════════════════════════════════════════════════
//  RÄNGE – pro Sprache eine eigene Reihe, in der Zielsprache
// ════════════════════════════════════════════════════════════
const XP_STUFEN = [0, 50, 150, 300, 500, 750, 1000, 1400, 1800, 2500];
const NIVEAUS = {
  fr: ['Première année','Apprentie','Élève sorcière','Préfète','Enchanteresse',
       'Alchimiste','Métamorphe','Duelliste','Sorcière','Grande Magicienne'],
  en: ['First Year','Apprentice','Spell Student','Prefect','Enchantress',
       'Alchemist','Shapeshifter','Duellist','Sorceress','Archmage'],
};

function niveauVon(sprache) {
  const xp = daten.xp[sprache] || 0;
  let idx = 0;
  for (let i = 0; i < XP_STUFEN.length; i++) {
    if (xp >= XP_STUFEN[i]) idx = i; else break;
  }
  const max = idx === XP_STUFEN.length - 1;
  const lo = XP_STUFEN[idx];
  const hi = max ? lo + 500 : XP_STUFEN[idx + 1];
  return { idx, name: (NIVEAUS[sprache] || NIVEAUS.fr)[idx], xp, lo, hi, max };
}

function zeigeNiveau(sprache) {
  const n = niveauVon(sprache);
  document.getElementById('level-badge').textContent = `🪄 ${n.idx + 1}. Rang · ${n.name}`;
  document.getElementById('xp-bar-fill').style.width =
    Math.min(100, ((n.xp - n.lo) / (n.hi - n.lo)) * 100) + '%';
  document.getElementById('xp-label').textContent =
    n.max ? `⏳ ${n.xp} Punkte` : `⏳ ${n.xp - n.lo} / ${n.hi - n.lo}`;
}

function gibXP(sprache, serie) {
  const bonus = Math.min(20, Math.max(0, serie - 1) * 5);
  const gewonnen = 10 + bonus;
  const vorher = niveauVon(sprache).idx;
  daten.xp[sprache] = (daten.xp[sprache] || 0) + gewonnen;
  speichere();
  const nachher = niveauVon(sprache);
  zeigeNiveau(sprache);
  if (nachher.idx > vorher) zeigeLevelUp(nachher.name);
  return gewonnen;
}

function zeigeXPGewinn(xp, serie, el) {
  const p = document.createElement('div');
  p.className = 'xp-popup';
  p.textContent = serie >= 2 ? `+${xp} Punkte ✨` : `+${xp} Punkte`;
  document.body.appendChild(p);
  const r = el.getBoundingClientRect();
  p.style.left = (r.left + r.width / 2) + 'px';
  p.style.top = r.top + 'px';
  setTimeout(() => p.remove(), 1200);
}

function zeigeLevelUp(name) {
  const el = document.createElement('div');
  el.className = 'level-up-toast';
  el.innerHTML = `✦ Neuer Rang ✦<br>🪄 ${name}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2700);
}

// ════════════════════════════════════════════════════════════
//  SPRACHE / VORLESEN
// ════════════════════════════════════════════════════════════
let vorlesen = daten.vorlesen !== false;

function setzeVorlesen(an) {
  vorlesen = an;
  daten.vorlesen = an;
  speichere();
}

function sprich(text, lang) {
  if (!window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = lang;
  utt.rate = 0.88;
  utt.pitch = 1.05;
  const btn = document.getElementById('speak-btn-active');
  if (btn) {
    btn.classList.add('speaking');
    utt.onend = () => btn.classList.remove('speaking');
    utt.onerror = () => btn.classList.remove('speaking');
  }
  window.speechSynthesis.speak(utt);
}

// iOS gibt Sprachausgabe und Töne erst nach einer Berührung frei
let audioEntsperrt = false;
function entsperreAudio() {
  if (audioEntsperrt) return;
  audioEntsperrt = true;

  // Töne sollen auch dann kommen, wenn der Klingelton-Schalter auf lautlos
  // steht (Safari 16.4+); ohne diese Zeile schweigt Web Audio dort.
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}

  // Stummes Schnipsel abspielen – damit gilt der Ton-Kontext als freigegeben
  try {
    const ctx = tonKontext();
    if (ctx) {
      const quelle = ctx.createBufferSource();
      quelle.buffer = ctx.createBuffer(1, 1, 22050);
      quelle.connect(ctx.destination);
      quelle.start(0);
    }
  } catch (e) {}

  try {
    if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    }
  } catch (e) {}
}

function sprichFrage() {
  const k = aktuell.karten[aktuell.index];
  if (k && k.sprechFrage) sprich(k.sprechFrage.text, k.sprechFrage.lang);
}

// ════════════════════════════════════════════════════════════
//  KARTEN BAUEN
// ════════════════════════════════════════════════════════════
const LIMIT = 20;

function mische(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sprachCode(deck) {
  return deck.sprache === 'en' ? 'en-GB' : 'fr-FR';
}

function zahlenFalsche(num, modus) {
  const kandidaten = new Set();
  for (const d of [1, 2, 3, 5, 10, 20, 50, 100]) {
    if (num - d >= 1) kandidaten.add(num - d);
    if (num + d <= 1000) kandidaten.add(num + d);
  }
  return mische([...kandidaten].filter(n => n !== num))
    .slice(0, 3)
    .map(n => modus === 'num-f' ? franzZahl(n) : String(n));
}

// Erzeugt aus einem Eintrag die anzeigefertige Karte
function baueKarte(deck, eintrag, modus) {
  const lang = sprachCode(deck);
  const basis = { deckId: deck.id, schluessel: schluessel(eintrag), sprache: deck.sprache || 'fr' };

  if (deck.typ === 'zahlen') {
    const numFr = modus === 'num-f';
    return Object.assign(basis, {
      label: numFr ? '🔢 Zahl' : '🇫🇷 Französisch',
      frage: numFr ? String(eintrag.num) : eintrag.fr,
      korrekt: numFr ? eintrag.fr : String(eintrag.num),
      falsche: zahlenFalsche(eintrag.num, modus),
      // In 🔢→🇫🇷 nicht vorlesen, sonst wäre die Antwort verraten
      sprechFrage: numFr ? null : { text: eintrag.fr, lang },
      sprechAntwort: { text: eintrag.fr, lang },
    });
  }

  if (deck.typ === 'artikel') {
    return Object.assign(basis, {
      label: '✏️ un, une oder des?',
      frage: eintrag.fr,
      korrekt: eintrag.de,
      falsche: eintrag.falsche,
      sprechFrage: { text: eintrag.sprechFrage, lang },
      sprechAntwort: { text: eintrag.sprechAntwort, lang },
    });
  }

  if (deck.typ === 'konjugation') {
    return Object.assign(basis, {
      label: '💜 Konjugieren',
      frage: eintrag.fr,
      korrekt: eintrag.de,
      falsche: mische(eintrag.falsche).slice(0, 3),
      sprechFrage: null,
      sprechAntwort: { text: eintrag.sprechAntwort, lang },
    });
  }

  // vokabeln
  const nachDe = modus === 'f-d';
  const flagge = deck.sprache === 'en' ? '🇬🇧 Englisch' : '🇫🇷 Französisch';
  const korrekt = nachDe ? eintrag.de : eintrag.fr;
  // Gleichlautende Übersetzungen aussortieren, sonst stünde dieselbe
  // Antwort zweimal da – einmal richtig, einmal falsch
  const andere = mische(deck.woerter.filter(w => w !== eintrag))
    .map(w => nachDe ? w.de : w.fr)
    .filter(t => t !== korrekt);
  return Object.assign(basis, {
    label: nachDe ? flagge : '🇩🇪 Deutsch',
    frage: nachDe ? eintrag.fr : eintrag.de,
    korrekt,
    falsche: [...new Set(andere)].slice(0, 3),
    sprechFrage: nachDe ? { text: eintrag.fr, lang } : { text: eintrag.de, lang: 'de-DE' },
    sprechAntwort: nachDe ? { text: eintrag.de, lang: 'de-DE' } : { text: eintrag.fr, lang },
  });
}

// Fehlerliste → [{ deck, eintrag }], unbekannte Einträge fallen weg
function fehlerEintraege() {
  const raus = [];
  daten.fehler.forEach(f => {
    const deck = alleDecks[f.d];
    if (!deck || deck.typ === 'fehler') return;
    const eintrag = deck.woerter.find(w => schluessel(w) === f.k);
    if (eintrag) raus.push({ deck, eintrag });
  });
  return raus;
}

function baueSession(deck, modus) {
  const quelle = deck.typ === 'fehler'
    ? fehlerEintraege()
    : deck.woerter.map(w => ({ deck, eintrag: w }));
  return mische(quelle)
    .slice(0, LIMIT)
    .map(({ deck: d, eintrag }) =>
      baueKarte(d, eintrag, deck.typ === 'fehler' ? standardModus(d) : modus));
}

// ════════════════════════════════════════════════════════════
//  MENÜ
// ════════════════════════════════════════════════════════════
function wannText(zeit) {
  if (!zeit) return null;
  const tage = Math.floor((Date.now() - zeit) / 86400000);
  if (tage <= 0) return 'heute geübt';
  if (tage === 1) return 'gestern geübt';
  if (tage < 7)  return `vor ${tage} Tagen geübt`;
  if (tage < 30) return `vor ${Math.floor(tage / 7)} Wochen geübt`;
  return 'länger nicht geübt';
}

function untertitel(deck) {
  const n = anzahlWoerter(deck);
  if (deck.typ === 'fehler') {
    return n === 0 ? 'keine Fehler – super!' : `${n} Wörter aus allen Listen`;
  }
  if (n === 0) return 'noch keine Wörter erfasst';
  const stand = daten.decks[deck.id];
  const wann = stand && wannText(stand.zuletzt);
  return `${n} Wörter` + (wann ? ` · ${wann}` : ' · neu');
}

function zeigeMenu() {
  document.getElementById('gruppen').innerHTML = QUIZ_DATEN.gruppen.map((g, gi) => {
    const n = g.sprache ? niveauVon(g.sprache) : null;
    return `
    <div class="group ${g.offen ? '' : 'closed'}" id="g${gi}">
      <button class="group-head" onclick="klappe(${gi})">
        <span class="dot" style="background:${g.farbe}"></span>
        <span class="title">${g.titel}</span>
        ${n ? `<span class="niveau">⭐ Niv. ${n.idx + 1}</span>` : ''}
        <span class="chev">▼</span>
      </button>
      <div class="deck-list">
        ${g.decks.map(d => {
          const leer = anzahlWoerter(d) === 0;
          const stand = daten.decks[d.id];
          const quote = stand ? stand.letzteQuote : 0;
          return `
          <button class="deck ${leer ? 'leer' : ''}"
                  style="--dc:${g.farbe}; --dcl:${g.hell}; --p:${quote}"
                  ${leer ? 'disabled' : `onclick="oeffneDeck('${d.id}')"`}>
            <span class="icon">${d.icon}</span>
            <span class="txt"><b>${d.titel}</b><span>${untertitel(d)}</span></span>
            <span class="ring"><i>${stand ? quote + '%' : '·'}</i></span>
          </button>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  // „Weiter üben"
  const btn = document.getElementById('resume-btn');
  const letztes = daten.letztes && alleDecks[daten.letztes.deckId];
  if (letztes && anzahlWoerter(letztes) > 0) {
    const stand = daten.decks[letztes.id];
    const wann = stand && wannText(stand.zuletzt);
    btn.innerHTML = `
      <span class="emoji">⏱️</span>
      <span class="t"><b>Weiter üben</b><span>${letztes.titel}${wann ? ' — ' + wann : ''}</span></span>
      <span class="go">→</span>`;
    btn.style.display = '';
    btn.onclick = () => oeffneDeck(letztes.id, daten.letztes.modus);
  } else {
    btn.style.display = 'none';
  }

  const gesamt = Object.values(alleDecks)
    .reduce((s, d) => s + (d.typ === 'vokabeln' ? d.woerter.length : 0), 0);
  document.getElementById('hinweis').textContent = `${gesamt} Wörter · dazu Konjugation, Zahlen und un/une`;
}

function klappe(gi) {
  document.getElementById('g' + gi).classList.toggle('closed');
}

function zumMenu() {
  stoppeTimer();
  stoppeCanvas();
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.body.classList.remove('quiz');
  document.getElementById('kopf').textContent = '✦ Sprachen Üben ✦';
  zeigeMenu();
  window.scrollTo(0, 0);
}

// ════════════════════════════════════════════════════════════
//  QUIZ
// ════════════════════════════════════════════════════════════
const aktuell = { deck: null, modus: null, index: 0, score: 0, beantwortet: false, karten: [] };
let serie = 0;

function oeffneDeck(id, modus) {
  entsperreAudio();
  const deck = alleDecks[id];
  if (!deck) return;
  aktuell.deck = deck;
  aktuell.modus = modus || standardModus(deck);

  daten.letztes = { deckId: id, modus: aktuell.modus };
  speichere();

  document.body.classList.add('quiz');
  document.getElementById('kopf').textContent = deck.titel;
  document.documentElement.style.setProperty('--c', deck.farbe);
  document.documentElement.style.setProperty('--cl', deck.hell);
  document.getElementById('autoread-toggle').checked = vorlesen;

  document.getElementById('modi').innerHTML = modiVon(deck).map(m =>
    `<button class="mode-btn ${m.id === aktuell.modus ? 'active' : ''}"
             onclick="setzeModus('${m.id}')">${m.label}</button>`).join('');

  starteRunde();
  window.scrollTo(0, 0);
}

function setzeModus(modus) {
  window.speechSynthesis && window.speechSynthesis.cancel();
  aktuell.modus = modus;
  daten.letztes = { deckId: aktuell.deck.id, modus };
  speichere();
  document.querySelectorAll('#modi .mode-btn').forEach(b =>
    b.classList.toggle('active', b.getAttribute('onclick').includes(`'${modus}'`)));
  starteRunde();
}

function starteRunde() {
  stoppeTimer();
  stoppeCanvas();
  serie = 0;
  aktuell.index = 0;
  aktuell.score = 0;
  aktuell.beantwortet = false;
  aktuell.karten = baueSession(aktuell.deck, aktuell.modus);
  zeichneFrage();
}

function zeichneFrage() {
  const area = document.getElementById('quiz-area');

  if (aktuell.index >= aktuell.karten.length) { zeigeErgebnis(); return; }

  const k = aktuell.karten[aktuell.index];
  zeigeNiveau(k.sprache);

  const optionen = mische([k.korrekt, ...k.falsche]);
  const fortschritt = (aktuell.index / aktuell.karten.length) * 100;

  area.innerHTML = `
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width:${fortschritt}%"></div>
    </div>
    <div class="progress-info">
      <span>Frage ${aktuell.index + 1} von ${aktuell.karten.length}</span>
      <span id="score-info">✅ ${aktuell.score} richtig</span>
    </div>
    <div class="card">
      <div class="card-label">${k.label}</div>
      <div class="card-word-wrap">
        <div class="card-word">${k.frage}</div>
        ${k.sprechFrage ? '<button class="speak-btn" id="speak-btn-active" onclick="sprichFrage()" title="Vorlesen">🔊</button>' : ''}
      </div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <div class="next-btn-wrap">
        <button class="next-btn hidden" id="next-btn" onclick="naechsteFrage()">
          <div class="countdown-fill"></div><span>Weiter →</span>
        </button>
      </div>
    </div>`;

  const box = document.getElementById('answers');
  const frag = document.createDocumentFragment();
  optionen.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'ans-btn';
    b.textContent = opt;
    b.addEventListener('click', () => pruefe(b, opt, k));
    frag.appendChild(b);
  });
  // Kurz gesperrt, damit ein Doppeltipp nicht gleich die nächste Antwort trifft
  box.style.pointerEvents = 'none';
  box.appendChild(frag);
  setTimeout(() => { box.style.pointerEvents = ''; }, 350);

  if (vorlesen && k.sprechFrage) setTimeout(sprichFrage, 300);
}

// ── Fehlerliste pflegen ──
function merkeFehler(k) {
  if (daten.fehler.some(f => f.d === k.deckId && f.k === k.schluessel)) return;
  daten.fehler.push({ d: k.deckId, k: k.schluessel });
  if (daten.fehler.length > MAX_FEHLER) daten.fehler.shift();
}

function loescheFehler(k) {
  daten.fehler = daten.fehler.filter(f => !(f.d === k.deckId && f.k === k.schluessel));
}

// Rückmeldungen in der Sprache des Decks – im Englisch-Quiz kein «Magnifique»
const lobText = {
  fr: [
    '✦ Magnifique !', '✦ Parfait !', '✦ Bravo !', '✦ Formidable !',
    '✦ Excellent !', '✦ Superbe !', '✦ Der Zauber sitzt!', '✦ Meisterlich!',
    '✦ Das sass!', '✦ Zauberhaft!',
  ],
  en: [
    '✦ Brilliant!', '✦ Splendid!', '✦ Well done!', '✦ Excellent!',
    '✦ Spot on!', '✦ Marvellous!', '✦ Der Zauber sitzt!', '✦ Meisterlich!',
    '✦ Das sass!', '✦ Zauberhaft!',
  ],
};

const trostText = {
  fr: [
    'Zut ! Der Zauber ging daneben – schau die Antwort an.',
    'Presque ! Merke dir die richtige Antwort.',
    'Noch nicht – aber der Bann bricht bald.',
    'Schau genau hin, dann sitzt der Spruch.',
    'Nächster Versuch, nächster Zauber.',
  ],
  en: [
    'Oops! Der Zauber ging daneben – schau die Antwort an.',
    'Almost! Merke dir die richtige Antwort.',
    'Noch nicht – aber der Bann bricht bald.',
    'Schau genau hin, dann sitzt der Spruch.',
    'Nächster Versuch, nächster Zauber.',
  ],
};
function zufall(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

let weiterTimer = null;
let sprechTimer = null;
function stoppeTimer() {
  if (weiterTimer) { clearTimeout(weiterTimer); weiterTimer = null; }
  if (sprechTimer) { clearTimeout(sprechTimer); sprechTimer = null; }
}

function pruefe(btn, gewaehlt, k) {
  if (aktuell.beantwortet) return;
  aktuell.beantwortet = true;
  stoppeTimer();

  document.querySelectorAll('#answers .ans-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === k.korrekt) b.classList.add('correct');
  });

  const feedback = document.getElementById('feedback');
  const richtig = gewaehlt === k.korrekt;

  if (richtig) {
    btn.classList.add('correct');
    aktuell.score++;
    serie++;
    const xp = gibXP(k.sprache, serie);
    zeigeXPGewinn(xp, serie, btn);
    document.getElementById('score-info').textContent =
      `✅ ${aktuell.score} richtig` + (serie >= 2 ? `  🔥 ${serie}` : '');
    feedback.textContent = zufall(lobText[k.sprache] || lobText.fr);
    feedback.className = 'feedback correct';
    tonRichtig();
    // Im Fehler-Deck gilt das Wort damit als aufgeholt
    if (aktuell.deck.typ === 'fehler') loescheFehler(k);
  } else {
    btn.classList.add('wrong');
    serie = 0;
    feedback.textContent = zufall(trostText[k.sprache] || trostText.fr);
    feedback.className = 'feedback wrong';
    tonFalsch();
    merkeFehler(k);
  }
  speichere();

  // Nur fremdsprachige Antworten vorlesen – deutsche Wörter kann sie selbst
  if (vorlesen && k.sprechAntwort && k.sprechAntwort.lang !== 'de-DE') {
    sprechTimer = setTimeout(() => sprich(k.sprechAntwort.text, k.sprechAntwort.lang), 600);
  }

  const dauer = richtig ? 2500 : 6000;
  const next = document.getElementById('next-btn');
  next.classList.remove('hidden');
  next.style.setProperty('--countdown-dur', (dauer / 1000) + 's');
  void next.offsetWidth;
  next.classList.add('counting');
  weiterTimer = setTimeout(naechsteFrage, dauer);
}

function naechsteFrage() {
  stoppeTimer();
  aktuell.index++;
  aktuell.beantwortet = false;
  zeichneFrage();
}

function zeigeErgebnis() {
  const gesamt = aktuell.karten.length;
  const pct = gesamt ? Math.round((aktuell.score / gesamt) * 100) : 0;

  // Fortschritt des Decks merken
  const stand = daten.decks[aktuell.deck.id] || { geuebt: 0 };
  stand.geuebt++;
  stand.letzteQuote = pct;
  stand.zuletzt = Date.now();
  daten.decks[aktuell.deck.id] = stand;
  speichere();

  let anim = '', text = '', sterne = '';
  if (pct === 100)     { text = 'Meisterhaft gezaubert!'; sterne = '✦ ✦ ✦'; konfetti(); tonFanfare(); }
  else if (pct >= 70)  { text = 'Stark gezaubert!'; sterne = '✦ ✦'; anim = baueZauberstab(); stoppeCanvas(); tonSonne(); }
  else if (pct >= 40)  { text = 'Die Kerze brennt noch – weiter!'; sterne = '✦'; anim = baueKerze(); stoppeCanvas(); tonRegenbogen(); }
  else                 { text = 'Der Zauber will noch geübt sein.'; anim = baueNebel(); stoppeCanvas(); tonRegen(); }

  document.getElementById('quiz-area').innerHTML = `
    <div class="result-screen">
      ${anim}
      <div class="stars">${sterne}</div>
      <h2>${text}</h2>
      <div class="result-score">${aktuell.score} / ${gesamt}</div>
      <p>${pct}% richtig beantwortet</p>
      <div class="result-btns">
        <button class="restart-btn" onclick="starteRunde()">🔄 Nochmal üben</button>
        <button class="menu-btn" onclick="zumMenu()">← Zur Übersicht</button>
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════════
//  ERGEBNIS-ANIMATIONEN
// ════════════════════════════════════════════════════════════
function baueZauberstab() {
  const funken = Array.from({ length: 7 }, (_, i) => {
    const winkel = (-140 + i * 24) * Math.PI / 180;
    const weite = 40 + Math.random() * 34;
    return `<div class="funke" style="
      --dx:${(Math.cos(winkel) * weite).toFixed(0)}px;
      --dy:${(Math.sin(winkel) * weite).toFixed(0)}px;
      animation-delay:${(i * 0.22).toFixed(2)}s;"></div>`;
  }).join('');
  return `<div class="stab-wrap"><div class="stab"></div><div class="stab-licht"></div>${funken}</div>`;
}

function baueKerze() {
  return `
    <div class="kerze-wrap">
      <div class="kerze-koerper"></div>
      <div class="kerze-docht"></div>
      <div class="kerze-flamme"></div>
    </div>`;
}

function baueNebel() {
  const schwaden = Array.from({ length: 7 }, (_, i) => {
    const breite = 70 + Math.random() * 90;
    return `<div class="nebel" style="
      left:${5 + Math.random() * 60}%;
      top:${Math.random() * 60}px;
      width:${breite.toFixed(0)}px;
      height:${(breite * 0.45).toFixed(0)}px;
      animation-duration:${(5 + Math.random() * 4).toFixed(1)}s;
      animation-delay:${(i * 0.7).toFixed(1)}s;"></div>`;
  }).join('');
  return `
    <div style="text-align:center;margin-bottom:4px;">
      <svg class="kessel" width="96" height="62" viewBox="0 0 96 62" fill="none">
        <ellipse cx="48" cy="18" rx="30" ry="8" fill="#1b1410"/>
        <path d="M18 18 C18 44, 30 56, 48 56 C66 56, 78 44, 78 18 Z" fill="#2b2119"/>
        <path d="M22 20 C23 42, 33 52, 48 52 C63 52, 73 42, 74 20 Z" fill="#3a2d21"/>
        <ellipse cx="48" cy="18" rx="26" ry="6.5" fill="#4a3b2a"/>
      </svg>
    </div>
    <div class="nebel-wrap">${schwaden}</div>`;
}

// ── Konfetti ──
let konfettiAnim = null;
let teilchen = [];

function stoppeCanvas() {
  if (konfettiAnim) { cancelAnimationFrame(konfettiAnim); konfettiAnim = null; }
  teilchen = [];
  const c = document.getElementById('anim-canvas');
  c.getContext('2d').clearRect(0, 0, c.width, c.height);
}

function konfetti() {
  stoppeCanvas();
  const canvas = document.getElementById('anim-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  // Goldene Funken statt bunter Schnipsel
  const farben = ['#e9cf7a','#c9a227','#f3dc9b','#8c6b14','#fff3c4','#d9b64a'];
  const formen = ['star','star','circle'];

  function nachschub(anzahl, oben) {
    for (let i = 0; i < anzahl; i++) {
      teilchen.push({
        x: Math.random() * canvas.width,
        y: oben ? -10 : -20 - Math.random() * canvas.height * 0.5,
        size: 6 + Math.random() * 10,
        color: farben[Math.floor(Math.random() * farben.length)],
        shape: formen[Math.floor(Math.random() * formen.length)],
        vx: (Math.random() - 0.5) * 4,
        vy: 2 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.2,
        opacity: 1,
        decay: 0.004 + Math.random() * 0.004,
      });
    }
  }
  nachschub(160, false);

  function stern(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      const b = (i * 4 * Math.PI) / 5 + (2 * Math.PI) / 5 - Math.PI / 2;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      ctx.lineTo(Math.cos(b) * r * 0.4, Math.sin(b) * r * 0.4);
    }
    ctx.closePath();
    ctx.restore();
  }

  function schleife() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    teilchen = teilchen.filter(p => p.opacity > 0.05);
    teilchen.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.rotV; p.opacity -= p.decay;
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2); ctx.fill();
      } else if (p.shape === 'rect') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
      } else {
        stern(p.x, p.y, p.size / 2, p.rot); ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
    if (teilchen.length > 0) konfettiAnim = requestAnimationFrame(schleife);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  konfettiAnim = requestAnimationFrame(schleife);
  setTimeout(() => nachschub(80, true), 800);
}

// ════════════════════════════════════════════════════════════
//  TÖNE
// ════════════════════════════════════════════════════════════
let audioCtx = null;

// iOS: der Ton-Kontext startet angehalten und muss bei jeder Berührung
// wieder aufgeweckt werden – sonst bleiben die Töne stumm, während die
// Sprachausgabe (anderer Weg) weiterhin hörbar ist.
function tonKontext() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}

function ton(freq, typ, dauer, laut, verzug = 0) {
  try {
    const ctx = tonKontext();
    if (!ctx) return;
    const start = ctx.currentTime + verzug;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = typ;
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(laut, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, start + dauer);
    osc.start(start);
    osc.stop(start + dauer);
  } catch (e) {}
}
function tonRichtig()    { ton(523,'sine',0.15,0.3,0); ton(784,'sine',0.2,0.3,0.12); }
function tonFalsch()     { ton(220,'sawtooth',0.18,0.15,0); ton(180,'sawtooth',0.18,0.10,0.08); }
function tonFanfare()    { [523,659,784,1047].forEach((f,i) => ton(f,'sine',0.25,0.28,i*0.13)); }
function tonSonne()      { [440,554,659,880].forEach((f,i) => ton(f,'sine',0.2,0.22,i*0.1)); }
function tonRegenbogen() { [349,440,523].forEach((f,i) => ton(f,'triangle',0.3,0.18,i*0.08)); }
function tonRegen()      { ton(330,'triangle',0.2,0.15,0); ton(392,'triangle',0.2,0.15,0.2); ton(330,'triangle',0.2,0.15,0.4); }

// ════════════════════════════════════════════════════════════
//  START

document.getElementById('autoread-toggle').checked = vorlesen;
zeigeMenu();
</script>
